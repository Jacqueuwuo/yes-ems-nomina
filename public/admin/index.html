<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YES EMS (Nómina)</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="manifest" href="/manifest-admin.json">
<meta name="theme-color" content="#1E4079">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="/assets/logo.png" alt="YES EMS">
      <div class="brand-text">
        <div class="name">YES EMS</div>
        <div class="tag">Nómina quincenal</div>
      </div>
    </div>

    <nav class="side-nav" id="sideNav">
      <button class="nav-item" type="button" data-section="inicio">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg>
        Inicio
      </button>
      <button class="nav-item" type="button" data-section="personal">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        Personal
      </button>
      <button class="nav-item" type="button" data-section="asistencias">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
        Asistencias
      </button>
      <button class="nav-item" type="button" data-section="incidencias">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.9 18a2 2 0 0 0 1.7 3h16.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
        Incidencias
      </button>
      <button class="nav-item" type="button" data-section="periodos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        Periodos de nómina
      </button>
      <button class="nav-item" type="button" data-section="percepciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
        Percepciones
      </button>
      <button class="nav-item" type="button" data-section="deducciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>
        Deducciones
      </button>
      <button class="nav-item" type="button" data-section="pagos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="14" rx="2"/><path d="M2 10h20"/><path d="M6 15h4"/></svg>
        Pagos y recibos
      </button>
      <button class="nav-item" type="button" data-section="reportes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M6 21V10M12 21V4M18 21v-7"/></svg>
        Reportes
      </button>
    </nav>

    <div class="side-foot">
      <span id="sideUser">&nbsp;</span>
      <div class="side-foot-actions">
        <button class="ch-link-btn" id="btnAccount" type="button">Mi cuenta</button>
        <button class="ch-link-btn" id="btnLogout" type="button">Cerrar sesión</button>
      </div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <h1 class="section-title" id="sectionTitle">Inicio</h1>
      <span class="save-status" id="saveStatus"></span>
      <div class="topbar-actions" id="sectionToolbar"></div>
    </header>

    <section class="view-body" id="viewBody">
      <div class="loading-state">Cargando…</div>
    </section>
  </main>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="/admin/admin.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/service-worker.js").catch(function () {});
    });
  }
</script>
</body>
</html>
