<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — YES EMS Nómina</title>
<link rel="icon" href="/assets/favicon.ico">
<link rel="manifest" href="/manifest-admin.json">
<meta name="theme-color" content="#1E4079">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/assets/theme.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  body{ min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--sidebar-bg); padding:20px; }
  .card{ width:100%; max-width:360px; background:var(--surface); border-radius:18px; box-shadow:var(--shadow); padding:32px 28px; display:flex; flex-direction:column; gap:16px; }
  .logo{ width:64px; height:64px; border-radius:14px; align-self:center; }
  h1{ font-size:1.15rem; text-align:center; }
  .sub{ font-size:.82rem; color:var(--ink-soft); text-align:center; margin-top:-8px; }
  form{ display:flex; flex-direction:column; gap:14px; margin-top:6px; }
  .btn-primary{ justify-content:center; padding:11px; font-size:.9rem; }
</style>
</head>
<body>
  <div class="card" id="loginCard"></div>

<script>
  function api(method, path, body) {
    return fetch(path, {
      method: method,
      headers: body ? { "Content-Type": "application/json" } : {},
      body: body ? JSON.stringify(body) : undefined,
    }).then(function (r) {
      return r.json().then(function (data) {
        if (!r.ok) throw new Error((data && data.error) || "Ocurrió un error.");
        return data;
      });
    });
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  var card = document.getElementById("loginCard");

  function renderLogin() {
    card.innerHTML =
      '<img class="logo" src="/assets/logo.png" alt="YES EMS">' +
      '<h1>YES EMS — Nómina</h1>' +
      '<p class="sub">Panel de administración</p>' +
      '<form id="loginForm">' +
      '<div class="field"><label for="usuario">Usuario</label>' +
      '<input id="usuario" name="usuario" type="text" autocomplete="username" required></div>' +
      '<div class="field"><label for="password">Contraseña</label>' +
      '<input id="password" name="password" type="password" autocomplete="current-password" required></div>' +
      '<p class="field-error" id="loginError">&nbsp;</p>' +
      '<button class="btn btn-primary" type="submit">Entrar</button>' +
      '</form>';

    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var errEl = document.getElementById("loginError");
      errEl.textContent = "";
      var usuario = document.getElementById("usuario").value.trim();
      var password = document.getElementById("password").value;
      api("POST", "/api/login", { usuario: usuario, password: password })
        .then(function () { window.location.href = "/admin"; })
        .catch(function (err) { errEl.textContent = err.message || "No se pudo iniciar sesión."; });
    });
  }

  // Si el enlace trae ?token=..., es una invitacion para un administrador
  // NUEVO que todavia no elige su contraseña (ver "Agregar administrador"
  // en Mi cuenta dentro del panel) -- mismo mecanismo que ya usa el
  // Portal del trabajador en /mi-nomina.
  function renderActivar(token) {
    card.innerHTML = '<img class="logo" src="/assets/logo.png" alt="YES EMS"><p class="sub">Cargando…</p>';
    api("GET", "/api/admin-activacion/" + encodeURIComponent(token))
      .then(function (data) {
        card.innerHTML =
          '<img class="logo" src="/assets/logo.png" alt="YES EMS">' +
          '<h1>Activa tu cuenta</h1>' +
          '<p class="sub">Hola, ' + escapeHtml(data.usuario) + '. Elige tu contraseña para entrar al panel.</p>' +
          '<form id="activarForm">' +
          '<div class="field"><label>Usuario</label><input type="text" value="' + escapeHtml(data.usuario) + '" disabled></div>' +
          '<div class="field"><label for="aPass1">Nueva contraseña</label><input id="aPass1" type="password" autocomplete="new-password" required></div>' +
          '<div class="field"><label for="aPass2">Repite la contraseña</label><input id="aPass2" type="password" autocomplete="new-password" required></div>' +
          '<p class="field-hint">Al menos 8 caracteres, con letras y números.</p>' +
          '<p class="field-error" id="activarError">&nbsp;</p>' +
          '<button class="btn btn-primary" type="submit">Activar mi cuenta</button>' +
          '</form>';

        document.getElementById("activarForm").addEventListener("submit", function (e) {
          e.preventDefault();
          var errEl = document.getElementById("activarError");
          errEl.textContent = "";
          var p1 = document.getElementById("aPass1").value;
          var p2 = document.getElementById("aPass2").value;
          if (p1 !== p2) { errEl.textContent = "Las contraseñas no coinciden."; return; }
          api("POST", "/api/admin-activacion/" + encodeURIComponent(token), { password: p1 })
            .then(function () { window.location.href = "/admin"; })
            .catch(function (err) { errEl.textContent = err.message; });
        });
      })
      .catch(function (err) {
        card.innerHTML =
          '<img class="logo" src="/assets/logo.png" alt="YES EMS">' +
          '<h1>Enlace no válido</h1>' +
          '<p class="sub">' + escapeHtml(err.message) + '</p>' +
          '<button class="btn btn-ghost" type="button" id="irLogin" style="justify-content:center;">Ir a iniciar sesión</button>';
        document.getElementById("irLogin").addEventListener("click", function () {
          window.history.replaceState({}, "", "/login");
          renderLogin();
        });
      });
  }

  var params = new URLSearchParams(window.location.search);
  var token = params.get("token");
  if (token) renderActivar(token);
  else renderLogin();
</script>
</body>
</html>
